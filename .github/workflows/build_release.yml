name: Build & Release AutoSGS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name="AutoSGS" `
            --icon="assets/icon.ico" `
            --version-file="packaging/version_info.txt" `
            --add-data="assets/fonts;assets/fonts" `
            --add-data="assets/icon.ico;assets" `
            --collect-all="customtkinter" `
            --hidden-import="pynput.keyboard._win32" `
            --hidden-import="pynput.mouse._win32" `
            main.py
          
          Copy-Item -Path "packaging/Unblock_AutoSGS.bat" -Destination "dist/"
          Copy-Item -Path "packaging/คำแนะนำการเปิดใช้งาน_SmartScreen.txt" -Destination "dist/"
          Compress-Archive -Path "dist/AutoSGS.exe", "dist/Unblock_AutoSGS.bat", "dist/คำแนะนำการเปิดใช้งาน_SmartScreen.txt" -DestinationPath "dist/AutoSGS-Windows-Portable.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSGS-Windows
          path: |
            dist/AutoSGS.exe
            dist/AutoSGS-Windows-Portable.zip
            dist/Unblock_AutoSGS.bat

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS Application
        run: |
          chmod +x packaging/build_mac.sh
          ./packaging/build_mac.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSGS-macOS
          path: dist/AutoSGS-macOS.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AutoSGS-*
          path: release
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
